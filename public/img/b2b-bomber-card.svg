<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-labelledby="posterTitle posterDesc">
  <title id="posterTitle">B2B Bomber arcade poster</title>
  <desc id="posterDesc">An original white, blue and yellow four-engine bomber climbing through a dark blue night sky above a distant city, with yellow contrails and a glowing moon.</desc>
