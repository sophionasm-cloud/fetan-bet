      <stop offset=".32" stop-color="#cfe4ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#7fb6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horizonGlow" x1="0" y1="0" x2="0" y2="1">
