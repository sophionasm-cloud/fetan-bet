<!doctype html>
<html lang="am">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b09">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fetan Bet">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="fetan-icon.png">
  <title>ፈጣን ቤት | Fetan Bet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Oswald:wght@600;700&family=Noto+Sans+Ethiopic:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="games.css">
</head>
<body>
  <header class="top">
    <div class="brand" id="brandBtn" style="cursor:pointer">
      <span class="logo">ፈ</span>
      <span>
        <span id="brandName">FETAN BET</span>
        <span class="brand-sub">ፍጣን ቤት</span>
      </span>
    </div>
    <div class="top-right">
      <button id="balanceBox" class="balance" type="button" hidden></button>
      <button id="quickDepositBtn" class="chip chip-gold" hidden>+ <span id="depTxt">Deposit</span></button>
      <button id="headerLoginBtn" class="chip" hidden></button>
      <button id="headerRegBtn" class="chip chip-gold" hidden></button>
      <button id="langBtn" class="chip">አማ</button>
      <button id="logoutBtn" class="chip" hidden></button>
      <div class="mobile-header-menu">
        <button id="mobileHeaderMenu" class="mobile-header-menu-button" type="button" aria-label="Menu" aria-expanded="false">☰</button>
        <div id="mobileMenuPanel" class="mobile-header-menu-panel" hidden></div>
      </div>
    </div>
  </header>
  <div class="stripe"></div>
  <nav id="nav" class="tabs" hidden></nav>
  <main id="app"></main>
  <div id="toast" class="toast" hidden></div>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="games.js"></script>
  <script src="app.js"></script>
</body>
</html>
