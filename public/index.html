<!doctype html>
<html lang="am">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141414">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fetan Bet">
  <script>
    if (/^#\/game\/(?:road|road-dash|chicken-road-2|penalty|mines|plinko|keno|bingo|roulette|star)$/.test(location.hash)) {
      document.documentElement.classList.add('fetan-game-immersive');
    }
  </script>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="fetan-icon.png">
  <title>ፈጣን ቤት | Fetan Bet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="games.css">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="customer-premium.css">
  <link rel="stylesheet" href="customer-glass.css">
  <link rel="stylesheet" href="immersive-games.css">
  <link rel="stylesheet" href="home-v2.css">
</head>
<body class="customer-theme" data-customer-theme="dark">
  <header class="top">
    <div class="brand" id="brandBtn" role="button" tabindex="0" aria-label="Fetan Bet home">
      <span class="logo" aria-hidden="true">ፈ</span>
      <span class="brand-copy"><span id="brandName">FETAN BET</span></span>
    </div>
    <nav id="publicPrimaryNav" class="public-primary-nav" aria-label="Main navigation" hidden></nav>
    <div class="top-right">
      <button id="balanceBox" class="balance" type="button" hidden></button>
      <button id="quickDepositBtn" class="chip chip-gold" hidden>+ <span id="depTxt">Deposit</span></button>
      <button id="headerLoginBtn" class="chip" hidden>Login</button>
      <button id="headerRegBtn" class="chip chip-gold" hidden>Register</button>
      <button id="langBtn" class="chip">አማ</button>
      <button id="logoutBtn" class="chip" hidden>Logout</button>
      <div class="mobile-header-menu">
        <button id="mobileHeaderMenu" class="mobile-header-menu-button" type="button" aria-label="Menu" aria-expanded="false" aria-controls="mobileMenuPanel">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div id="mobileMenuPanel" class="mobile-header-menu-panel" role="menu" aria-label="Account menu" hidden></div>
      </div>
    </div>
  </header>
  <div class="stripe" aria-hidden="true"></div>
  <nav id="nav" class="tabs" aria-label="Customer navigation" hidden></nav>
  <main id="app"></main>
  <div id="toast" class="toast" hidden></div>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="site-config.js"></script>
  <script src="game-shell.js"></script>
  <script src="games.js"></script>
  <script src="app.js"></script>
  <script src="workspace.js"></script>
</body>
</html>
