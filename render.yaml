# Render Blueprint configuration for Fetan Bet
# Recommended Region: Ohio (us-east) to match Neon AWS us-east-2
services:
  - type: web
    name: fetan-bet
    env: node
    region: ohio
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      # Fail-closed server-side wagering policy. Keep "demo" until legal,
      # licensing, certification and payment approvals are documented. Real
      # mode additionally requires REAL_MONEY_AUTHORIZATION (an approval
      # reference, not a boolean) in the Render environment.
      - key: WAGERING_MODE
        value: demo
